<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
    <title>GVoicePlus</title>
    <style>
        /* Colours come from the query string (see titleBar.js) so the strip is themed from the first paint. */
        :root { --bg: #ffffff; --fg: #202124; --hover: #e8eaed; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
                     font: 12px "Segoe UI", system-ui, sans-serif; user-select: none; }
        /* The whole strip drags the window; only the labels are clickable.  The right side is left free for the
           native minimise / maximise / close buttons that Windows draws over it. */
        #bar { display: flex; align-items: center; height: 32px; padding: 0 4px;
               -webkit-app-region: drag; }
        .menu { -webkit-app-region: no-drag; padding: 0 10px; height: 26px; line-height: 26px; border-radius: 4px;
                cursor: default; background: transparent; color: inherit; border: 0; font: inherit; }
        .menu:hover, .menu.open { background: var(--hover); }
    </style>
</head>
<body>
    <div id="bar">
        <button class="menu" data-index="0">File</button>
        <button class="menu" data-index="1">Edit</button>
        <button class="menu" data-index="2">View</button>
        <button class="menu" data-index="3">Help</button>
    </div>
    <script src="titlebar.js"></script>
</body>
</html>
